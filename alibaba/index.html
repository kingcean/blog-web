<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:image" content="../images/bg/poster.jpg">
    <title>Projects at Alibaba Group - Kingcean.org</title>
    <link href="https://cdn.jsdelivr.net/npm/hje@2.4.3/docs/css/site.org.css" rel="stylesheet" />
    <link href="../css/current.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs2015.min.css" rel="stylesheet" />
    <style type="text/css" >
    section.x-part-projects-banner {
        margin-bottom: 20px; cursor: default; user-select: none;
    }
    section.x-part-projects-banner > a:first-child, section.x-part-projects-banner > a:visited:first-child, section.x-part-projects-banner > a:hover:first-child, section.x-part-projects-banner > a:active:first-child {
        text-decoration: none;
    }
    section.x-part-projects-banner > a:first-child::before {
        content: "<"; margin-right: 8px;
    }
    section.x-part-projects-banner > a:first-child + span::before {
        content: "|"; margin-left: 20px; margin-right: 20px;
    }
    </style>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/marked@16.2.1/lib/marked.umd.js" ></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/hje@2.4.3/docs/js/mdblogs.js" ></script>
</head>
<body>
    <header>
        <section>
            <h1><a href="https://kingcean.org"><strong>Kingcean</strong><span>.org</span></a></h1>
            <ul>
                <li>
                    <a id="topmenu-blogs" href="https://kingcean.org/blog">Blogs</a>
                </li>
                <li>
                    <a href="https://compositejs.github.io">CompositeJs</a>
                </li>
                <li>
                    <a href="https://12dlabs.github.io/?kingcean">12D Labs</a>
                </li>
            </ul>
        </section>
    </header>
    <section id="blog_content" ></section>
    <script type="text/javascript">
        DeepX.MdBlogs.render("blog_content", "./config.json", {
            title: true,
            banner: {
                tagName: "section",
                styleRefs: "x-part-projects-banner",
                children: [{
                    tagName: "a",
                    props: { href: "../" },
                    children: DeepX.MdBlogs.getLocaleString("goHome")
                }, {
                    tagName: "span",
                    children: [
                        { tagName: "span", children: "Projects at " },
                        { tagName: "strong", children: "Alibaba" },
                        { tagName: "span", children: " Group" }
                    ]
                }]
            }
        });
        DeepX.MdBlogs.setElementText("topmenu-blogs", "blogs");
    </script>
    <footer>
        <section>
            <div class="x-copyright">
                <img alt="Kingcean.org" src="../images/logos/barcode.svg" />
                <span>&copy; Kingcean Tuan 2021 &nbsp; | &nbsp; Front-end</span>
            </div>
        </section>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:image" content="../images/bg/poster.jpg">
    <title>Projects at Alibaba Group - Kingcean.org</title>
    <link href="https://cdn.jsdelivr.net/npm/hje@2.1.0/docs/css/site.org.css" rel="stylesheet" />
    <link href="../css/current.css" rel="stylesheet" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/hje@2.1.0/dist/index.js" ></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/marked@16.2.1/lib/marked.umd.js" ></script>
    <style type="text/css" >
    #blog_content {
        display: block; min-height: 400px; padding-top: 0; grid-template-columns: auto;
    }
    #blog_content > section > p > img {
        width: 100%;
    }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/hje@2.1.0/docs/js/site.js" ></script>
    <script type="text/javascript">
    function onInit() {
        site.getString("blogs", "topmenu-blogs");
        site.getString("goHome", "link-gohome");

        var id = site.firstQuery();
        var menu = [
            { name: "Quark", id: "quark" },
            { name: "APASS", id: "apass" },
            { name: "Nine", id: "nine" },
            { name: "SOP", id: "sop" },
        ];
        var cntEle = document.getElementById("blog_content");
        if (!id) {
            cntEle.innerHTML = "<ul>" + menu.map(function (ele) {
                return "<li><a href=\"?" + ele.id + "\" >" + ele.name + "</a></li>"
            }).join("") + "</ul>";
            return;
        }
        
        fetch(id + ".md").then(function (r2) {
            return r2.text();
        }).then(function (r2) {
            r2 = r2.replace(/\(.\//g, "(./");
            cntEle.innerHTML = "<section>" + marked.parse(r2) + "</section>";
        }, function (r) {
            cntEle.innerHTML = "<section><em>" + site.getString("loadFailed") + "</em></section>";
        });
    }
    </script>
</head>
<body onload="onInit()">
    <header>
        <section>
            <h1><a href="https://kingcean.org"><strong>Kingcean</strong><span>.org</span></a></h1>
            <ul>
                <li>
                    <a id="topmenu-blogs" href="https://kingcean.org/blog">Blogs</a>
                </li>
                <li>
                    <a href="https://compositejs.github.io">CompositeJs</a>
                </li>
                <li>
                    <a href="https://12dlabs.github.io/?kingcean">12D Labs</a>
                </li>
            </ul>
        </section>
    </header>
    <section>
        <section><a href="../">&lt; <span id="link-gohome">Back to homepage</span></a><span> &nbsp; | &nbsp; Project at Alibaba Group</span></section>
    </section>
    <section id="blog_content"></section>
    <footer>
        <section>
            <div class="x-copyright">
                <img alt="Kingcean.org" src="../images/logos/barcode.svg" />
                <span>&copy; Kingcean Tuan 2021 &nbsp; | &nbsp; Front-end</span>
            </div>
        </section>
    </footer>
</body>
</html>
